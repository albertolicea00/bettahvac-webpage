<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BettaHVAC | Premium Heating & Cooling Services in Kentucky</title>
    <meta
      property="og:image"
      content="https://www.bettahvac.com/assets/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- No phone/email in plain text here — see src/lib/contact.js -->
    <meta
      property="og:image:alt"
      content="BettaHVAC — Premium Heating &amp; Cooling Services in Kentucky"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Set the theme before first paint: saved choice wins, otherwise
         follow the device color scheme (dark → hot, light → cold) -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("hvac-theme");
        } catch (e) {}
        var theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "hot"
            : "cold");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
