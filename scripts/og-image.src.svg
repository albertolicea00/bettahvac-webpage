      <circle cx="360" cy="24" r="1.6"/>
      <circle cx="26" cy="118" r="1.8"/>
      <path d="M122,128 l6,6 M128,128 l-6,6"/>
      <circle cx="242" cy="120" r="2.2"/>
      <path d="M354,124 h8 M358,120 v8"/>
      <circle cx="452" cy="122" r="1.6"/>
      <circle cx="118" cy="238" r="1.7"/>
      <path d="M28,244 h7 M31.5,240.5 v7"/>
      <circle cx="238" cy="242" r="2"/>
      <path d="M360,244 l6,6 M366,244 l-6,6"/>
      <circle cx="454" cy="246" r="2.1"/>
      <circle cx="124" cy="362" r="2"/>
      <path d="M242,358 h8 M246,354 v8"/>
      <circle cx="358" cy="366" r="1.7"/>
      <circle cx="30" cy="364" r="1.6"/>
      <path d="M452,362 l6,6 M458,362 l-6,6"/>
      <circle cx="120" cy="454" r="1.8"/>
      <path d="M240,452 h7 M243.5,448.5 v7"/>
      <circle cx="356" cy="456" r="2"/>
      <circle cx="452" cy="452" r="1.5"/>
      <circle cx="26" cy="30" r="1.5"/>
